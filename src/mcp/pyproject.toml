[project]
name = "school-lunch-mcp"
version = "0.1.0"
description = "MCP server for the NEIS school and school lunch APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.25.1,<5",
    "mcp>=1.28,<2",
    "pydantic-settings>=2.10.1,<3",
    "starlette>=0.46,<1",
    "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "respx>=0.22.0,<0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests with no external I/O",
    "integration: tests for MCP protocol and HTTP boundaries with mocked NEIS",
]
