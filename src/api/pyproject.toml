[project]
name = "meal-battle-api"
version = "0.1.0"
description = "Backend API for the Meal Battle school lunch application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.1,<0.117",
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.10.1,<3",
    "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25.1,<5",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
