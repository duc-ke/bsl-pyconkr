[project]
name = "school-lunch-agent"
version = "0.1.0"
description = "Multi-agent school lunch comparison service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-ag-ui==1.1.0",
    "agent-framework-devui==1.0.0b260813",
    "agent-framework-github-copilot==1.0.2",
    "agent-framework-orchestrations==1.1.0",
    "httpx>=0.28.1,<1",
    "mcp>=1.28,<2",
    "pydantic-settings>=2.10.1,<3",
    "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
]

[tool.uv]
package = false
prerelease = "if-necessary"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests with no external I/O",
    "integration: service boundary tests with injected agents and MCP gateway",
]
