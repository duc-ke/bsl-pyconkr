services:
  api:
    build:
      context: ./src/api
    environment:
      NEIS_BASE_URL: https://open.neis.go.kr
      NEIS_API_KEY: ${NEIS_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: src/mcp/Dockerfile
    environment:
      NEIS_BASE_URL: https://open.neis.go.kr
      NEIS_API_KEY: ${NEIS_API_KEY}
    ports:
      - "${MCP_PORT:-8001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: ./src/agent
    environment:
      MCP_URL: http://mcp:8000/mcp
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-auto}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - "${AGENT_PORT:-8002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./src/web
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/web-health",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
