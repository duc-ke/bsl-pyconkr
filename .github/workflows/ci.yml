name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('src/web/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('src/web/package-lock.json') != '' }}
        working-directory: src/web
        run: npm ci
      - name: Verify generated API types
        if: ${{ hashFiles('src/web/package-lock.json') != '' }}
        working-directory: src/web
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Build
        if: ${{ hashFiles('src/web/package-lock.json') != '' }}
        working-directory: src/web
        run: npm run build --if-present
      - name: Test
        if: ${{ hashFiles('src/web/package-lock.json') != '' }}
        working-directory: src/web
        run: npm test --if-present
      - name: Await frontend scaffold
        if: ${{ hashFiles('src/web/package-lock.json') == '' }}
        run: echo "src/web/package-lock.json is not present yet; skipping TypeScript checks."

  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        with:
          enable-cache: true
          cache-dependency-glob: src/api/uv.lock
      - name: Install dependencies
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        working-directory: src/api
        run: uv sync --locked --all-groups
      - name: Test
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        working-directory: src/api
        run: uv run --locked pytest
      - name: Await backend scaffold
        if: ${{ hashFiles('src/api/pyproject.toml') == '' }}
        run: echo "src/api/pyproject.toml is not present yet; skipping Python checks."

  agent:
    name: Python Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: src/agent/uv.lock
      - name: Install dependencies
        working-directory: src/agent
        run: uv sync --locked --all-groups
      - name: Test
        working-directory: src/agent
        run: uv run --locked pytest

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') != '' }}
        run: docker compose config
      - name: Await Compose scaffold
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') == '' }}
        run: echo "No Compose file is present yet; skipping configuration validation."

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/e2e/package-lock.json
      - name: Install dependencies
        working-directory: src/e2e
        run: npm ci
      - name: Install browser
        working-directory: src/e2e
        run: npx playwright install --with-deps chromium
      - name: Test full application
        working-directory: src/e2e
        run: npm test
