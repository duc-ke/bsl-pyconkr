name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci
      - name: Build
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm run build --if-present
      - name: Test
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm test --if-present
      - name: Await frontend scaffold
        if: ${{ hashFiles('frontend/package-lock.json') == '' }}
        run: echo "frontend/package-lock.json is not present yet; skipping TypeScript checks."

  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        with:
          enable-cache: true
          cache-dependency-glob: src/api/uv.lock
      - name: Install dependencies
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        working-directory: src/api
        run: uv sync --locked --all-groups
      - name: Test
        if: ${{ hashFiles('src/api/pyproject.toml') != '' }}
        working-directory: src/api
        run: uv run --locked pytest
      - name: Await backend scaffold
        if: ${{ hashFiles('src/api/pyproject.toml') == '' }}
        run: echo "src/api/pyproject.toml is not present yet; skipping Python checks."

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') != '' }}
        run: docker compose config
      - name: Await Compose scaffold
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') == '' }}
        run: echo "No Compose file is present yet; skipping configuration validation."
